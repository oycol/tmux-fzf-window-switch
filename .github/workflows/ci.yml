name: Switcher CI

on:
  push:
    branches: [main, 'refactor/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Regression & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tmux and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux python3

      - name: Install pinned fzf
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/fzf.tar.gz" https://github.com/junegunn/fzf/releases/download/v0.74.3/fzf-0.74.3-linux_amd64.tar.gz
          curl -fL --retry 3 -o "$RUNNER_TEMP/fzf_checksums.txt" https://github.com/junegunn/fzf/releases/download/v0.74.3/fzf_0.74.3_checksums.txt
          (cd "$RUNNER_TEMP" && grep 'fzf-0.74.3-linux_amd64.tar.gz' fzf_checksums.txt | sed 's/fzf-0.74.3-linux_amd64.tar.gz/fzf.tar.gz/' | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/fzf.tar.gz" -C "$RUNNER_TEMP" fzf
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/fzf" "$HOME/.local/bin/fzf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versions and syntax checks
        run: |
          tmux -V
          fzf --version
          python3 --version
          python3 -m compileall -q scripts/switcher tests
          for file in scripts/*.sh tmux_fzf_window_switch.tmux; do bash -n "$file"; done

      - name: Run automated test suite
        run: python3 -m unittest discover -s tests -v

  release:
    name: Publish tagged release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure tag points to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
        run: |
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          test "$TAG_SHA" = "$main_sha"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
