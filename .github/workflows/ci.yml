name: Switcher CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Regression & Tabby PTY E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (tmux, fzf, python3)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux fzf python3

      - name: Verify versions
        run: |
          tmux -V
          fzf --version
          python3 --version

      - name: Shell syntax check (bash -n)
        run: |
          bash -n scripts/*.sh
          bash -n tmux_fzf_window_switch.tmux

      - name: Start temporary tmux server for tests
        run: |
          tmux new-session -d -s ci_test -x 120 -y 40
          tmux new-window -t ci_test:1 -n worker
          tmux list-windows -t ci_test

      - name: Run automated test suite
        run: |
          python3 tests/test_switcher.py

      - name: Teardown tmux server
        if: always()
        run: |
          tmux kill-server 2>/dev/null || true
