name: Switcher CI

on:
  push:
    branches: [ main, refactor/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Regression & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (tmux, fzf, python3)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux fzf python3

      - name: Verify versions
        run: |
          tmux -V
          fzf --version
          python3 --version

      - name: Python syntax check
        run: |
          python3 -m py_compile scripts/switcher/*.py

      - name: Shell syntax check (bash -n)
        run: |
          bash -n scripts/*.sh
          bash -n tmux_fzf_window_switch.tmux

      - name: Run automated test suite
        run: |
          python3 -m unittest discover -s tests -v
